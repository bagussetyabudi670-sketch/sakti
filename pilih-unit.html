<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Unit · SEPAKAT</title>
  <link rel="icon" type="image/png" href="assets/img/logoAS.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f6f4f0; --ink:#1a2632; --ink-soft:#4a5a68; --line:#e2dbd0; --ledger:#2a4b3a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.6; }
    a { color:inherit; text-decoration:none; }
    .container { max-width:1200px; margin:0 auto; padding:0 32px; }
    .container-narrow { max-width:1000px; margin:0 auto; padding:0 32px; }
    .navbar { background:rgba(246,244,240,.92); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; backdrop-filter:blur(6px); }
    .nav-content { height:80px; display:flex; align-items:center; justify-content:space-between; }
    .logo { display:flex; align-items:center; gap:16px; }
    .logo-seal { width:48px; height:48px; object-fit:contain; border-radius:8px; }
    .logo-text { display:flex; flex-direction:column; line-height:1.1; }
    .logo-text h1 { font:600 22px/1.1 'Newsreader',serif; }
    .logo-text span { display:block; margin-top:-1px; color:var(--ink-soft); font-size:12px; font-weight:500; letter-spacing:.3px; }
    .nav-links { display:flex; gap:40px; color:#2e3d4b; font-size:15px; font-weight:500; }
    .nav-links a { padding-bottom:4px; border-bottom:2px solid transparent; }
    .nav-links a:hover { color:#0f1a24; border-color:#a73b2e; }
    .nav-toggle { display:none; background:none; border:0; cursor:pointer; padding:8px; }
    .nav-toggle span { display:block; width:24px; height:2px; margin:5px 0; background:#0f1a24; }
    main { flex:1; }
    .back-wrapper { padding-top:32px; }
    .back-link { display:inline-flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:14px; font-weight:500; }
    .back-link:hover { color:var(--ink); }
    .page-header { padding:40px 0 24px; text-align:center; }
    .page-header h2 { margin-bottom:12px; font:600 34px/1.1 'Newsreader',serif; }
    .page-header p { max-width:560px; margin:0 auto; color:var(--ink-soft); font-size:15px; }
    .page-header .opd-name { font-weight:700; color:var(--ledger); }
    .page-header .badge {
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 16px; margin-bottom:16px;
      border-radius:40px; font-size:12px; font-weight:700;
      letter-spacing:1px; text-transform:uppercase;
    }
    .badge.rhas { background:#FEF3C7; color:#92400E; border:1px solid #FDE68A; }
    .badge.final { background:#D1FAE5; color:#065F46; border:1px solid #A7F3D0; }
    .badge.bukti { background:#DBEAFE; color:#1E40AF; border:1px solid #BFDBFE; }

    .main-section { padding:40px 0 100px; }
    .cards-wrapper {
      display:grid; grid-template-columns:1fr 1fr; gap:24px;
      max-width:800px; margin:0 auto;
    }
    .unit-card {
      display:flex; flex-direction:column; align-items:center;
      padding:40px 28px; background:#fff;
      border:1px solid #e8e1d6; border-radius:18px;
      box-shadow:0 4px 16px rgba(0,0,0,.03);
      text-align:center; cursor:pointer;
      transition:all .3s cubic-bezier(.2,.9,.3,1);
    }
    .unit-card:hover {
      transform:translateY(-6px);
      box-shadow:0 20px 40px rgba(0,0,0,.08);
      border-color:var(--ledger);
    }
    .unit-icon {
      width:80px; height:80px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:20px; transition:all .3s;
    }
    .unit-icon i { font-size:32px; transition:all .3s; }
    .unit-icon.blue { background:#E3F2FD; }
    .unit-icon.blue i { color:#1976D2; }
    .unit-card:hover .unit-icon.blue { background:#1976D2; }
    .unit-card:hover .unit-icon.blue i { color:#fff; }
    .unit-icon.green { background:#D1FAE5; }
    .unit-icon.green i { color:#059669; }
    .unit-card:hover .unit-icon.green { background:#059669; }
    .unit-card:hover .unit-icon.green i { color:#fff; }
    .unit-card h3 {
      font-family:'Inter',sans-serif; font-size:18px; font-weight:800;
      letter-spacing:.5px; text-transform:uppercase;
      margin-bottom:8px; color:var(--ink);
    }
    .unit-card p {
      font-size:13px; color:var(--ink-soft);
      margin-bottom:24px; line-height:1.6;
    }
    .unit-btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:11px 26px; border-radius:50px;
      font-size:13px; font-weight:700;
      background:#F0F0F0; color:var(--ink);
      transition:all .3s;
    }
    .unit-card:hover .unit-btn {
      background:var(--ledger); color:#fff;
      transform:translateY(-2px);
      box-shadow:0 6px 16px rgba(42,75,58,.25);
    }
    .unit-btn i { font-size:11px; transition:transform .3s; }
    .unit-card:hover .unit-btn i { transform:translateX(4px); }

    footer { border-top:1px solid #e2dbd0; padding:36px 0; background:#fcfaf7; }
    .footer-content { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--ink-soft); flex-wrap:wrap; gap:12px; }
    .footer-content strong { color:var(--ink); font:600 16px 'Newsreader',serif; }

    @media (max-width:860px) {
      .container, .container-narrow { padding:0 24px; }
      .nav-content { height:68px; }
      .logo-text span { display:none; }
      .nav-toggle { display:block; }
      .nav-links { position:absolute; top:68px; left:0; right:0; display:flex; flex-direction:column; gap:0; max-height:0; overflow:hidden; background:var(--paper); border-bottom:1px solid var(--line); transition:max-height .3s; }
      .nav-links.open { max-height:260px; }
      .nav-links a { padding:16px 24px; border-bottom:1px solid #e8e1d6; }
      .cards-wrapper { grid-template-columns:1fr; max-width:420px; }
    }
    @media (max-width:480px) {
      .container, .container-narrow { padding:0 18px; }
      .page-header h2 { font-size:26px; }
      .unit-card { padding:32px 22px; }
      .unit-icon { width:68px; height:68px; }
      .unit-icon i { font-size:26px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">
        <img class="logo-seal" src="assets/img/logoAS.png" alt="Logo SEPAKAT" />
        <div class="logo-text">
          <h1>SEPAKAT</h1>
          <span>Sistem Pengawasan Kearsipan Terintegrasi</span>
        </div>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html#beranda">Beranda</a>
        <a href="index.html#tentang">Tentang</a>
        <a href="portal.html">Portal</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <div class="container-narrow back-wrapper">
      <a href="javascript:history.back()" class="back-link">
        <i class="fas fa-arrow-left"></i> Kembali
      </a>
    </div>

    <section class="page-header">
      <div class="container-narrow">
        <div id="actionBadge" class="badge rhas">
          <i class="fas fa-clock"></i> RHAS
        </div>
        <h2>Pilih Unit Kerja</h2>
        <p>Untuk: <span class="opd-name" id="opdName">...</span></p>
      </div>
    </section>

    <section class="main-section">
      <div class="container-narrow">
        <div class="cards-wrapper" id="cardsWrapper">

          <!-- UNIT PENGOLAH -->
          <a href="#" id="cardUP" class="unit-card">
            <div class="unit-icon blue">
              <i class="fas fa-building"></i>
            </div>
            <h3>Unit Pengolah</h3>
            <p>Lembar Kerja UP</p>
            <span class="unit-btn">
              Pilih UP <i class="fas fa-arrow-right"></i>
            </span>
          </a>

          <!-- UNIT KEARSIPAN -->
          <a href="#" id="cardUK" class="unit-card">
            <div class="unit-icon green">
              <i class="fas fa-archive"></i>
            </div>
            <h3>Unit Kearsipan</h3>
            <p>Lembar Kerja UK</p>
            <span class="unit-btn">
              Pilih UK <i class="fas fa-arrow-right"></i>
            </span>
          </a>

        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-content">
      <div><strong>SEPAKAT</strong> — Sistem Pengawasan Kearsipan Terintegrasi</div>
      <div>© 2026 SEPAKAT</div>
    </div>
  </footer>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const namaOpd = urlParams.get('opd') ? decodeURIComponent(urlParams.get('opd')) : '';
      const action = (urlParams.get('action') || 'rhas').toLowerCase();

      // URL dari list (sudah di-encode oleh list)
      const upUrl = urlParams.get('upUrl') ? decodeURIComponent(urlParams.get('upUrl')) : '#';
      const ukUrl = urlParams.get('ukUrl') ? decodeURIComponent(urlParams.get('ukUrl')) : '#';

      document.getElementById('opdName').textContent = namaOpd || 'Tidak diketahui';

      // Set badge
      const badge = document.getElementById('actionBadge');
      const icon = badge.querySelector('i');

      if (action === 'rhas') {
        badge.className = 'badge rhas';
        badge.innerHTML = '<i class="fas fa-clock"></i> RHAS';
      } else if (action === 'final') {
        badge.className = 'badge final';
        badge.innerHTML = '<i class="fas fa-check"></i> Final';
      } else if (action === 'bukti') {
        badge.className = 'badge bukti';
        badge.innerHTML = '<i class="fas fa-folder"></i> Bukti Dukung';
      }

      document.title = 'Pilih Unit · ' + (namaOpd || 'SEPAKAT');

      // Set link card
      const cardUP = document.getElementById('cardUP');
      const cardUK = document.getElementById('cardUK');

      if (upUrl && upUrl !== '#') {
        cardUP.href = upUrl;
        cardUP.target = '_blank';
      } else {
        cardUP.classList.add('disabled');
        cardUP.style.opacity = '0.5';
        cardUP.style.pointerEvents = 'none';
      }

      if (ukUrl && ukUrl !== '#') {
        cardUK.href = ukUrl;
        cardUK.target = '_blank';
      } else {
        cardUK.classList.add('disabled');
        cardUK.style.opacity = '0.5';
        cardUK.style.pointerEvents = 'none';
      }

      // Hamburger
      const navToggle = document.getElementById('navToggle');
      const navLinks = document.getElementById('navLinks');
      if (navToggle && navLinks) {
        navToggle.addEventListener('click', () => {
          const isOpen = navLinks.classList.toggle('open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
        });
        navLinks.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => {
            navLinks.classList.remove('open');
            navToggle.setAttribute('aria-expanded', 'false');
          });
        });
      }
    })();
  </script>
</body>
</html>
